      properties:
        timestamp:
          type: string
          description: Client UTC ISO timestamp; the server stores it without normalization.
        event: {type: string}
        sequence: {type: integer}
        level: {type: string}
        message: {type: string}
        data:
          type: object
          additionalProperties: true
    CollectionPredicate:
      {"oneOf": [{"type": "object", "additionalProperties": false, "properties": {"kind": {"enum": ["all", "any"]}, "conditions": {"type": "array", "items": {"$ref": "#/components/schemas/CollectionPredicate"}, "maxItems": 100}}, "required": ["kind", "conditions"]}, {"type": "object", "additionalProperties": false, "properties": {"kind": {"const": "field"}, "field": {"type": "string"}, "op": {"type": "string"}, "value": {}}, "required": ["kind", "field", "op", "value"]}, {"type": "object", "additionalProperties": false, "properties": {"kind": {"const": "tracks"}, "quantifier": {"enum": ["any", "all", "at_least", "percent"]}, "value": {"type": "integer", "minimum": 0}, "role": {"type": "string", "enum": ["performer", "album_artist", "composer", "lyricist"]}, "condition": {"$ref": "#/components/schemas/CollectionPredicate"}}, "required": ["kind", "quantifier", "value", "role", "condition"]}]}
    CollectionDefinition:
      {"type": "object", "additionalProperties": false, "properties": {"name": {"type": "string", "minLength": 1, "maxLength": 300}, "description": {"type": "string", "maxLength": 4000}, "entity_type": {"enum": ["track", "album", "artist", "genre"]}, "cover_album_id": {"anyOf": [{"type": "integer", "minimum": 1}, {"type": "null"}]}, "included": {"type": "array", "items": {"type": "integer", "minimum": 1}, "uniqueItems": true, "maxItems": 10000}, "excluded": {"type": "array", "items": {"type": "integer", "minimum": 1}, "uniqueItems": true, "maxItems": 10000}, "automatic": {"anyOf": [{"$ref": "#/components/schemas/CollectionPredicate"}, {"type": "null"}]}, "sort": {"type": "array", "maxItems": 5, "items": {"type": "object", "additionalProperties": false, "properties": {"field": {"type": "string"}, "descending": {"type": "boolean"}}, "required": ["field", "descending"]}}, "limit": {"anyOf": [{"type": "integer", "minimum": 1, "maximum": 10000}, {"type": "null"}]}, "refresh": {"enum": ["live", "daily", "manual"]}, "max_per_artist": {"anyOf": [{"type": "integer", "minimum": 1}, {"type": "null"}]}, "max_per_album": {"anyOf": [{"type": "integer", "minimum": 1}, {"type": "null"}]}, "playback": {"type": "object", "additionalProperties": false, "properties": {"filter": {"anyOf": [{"$ref": "#/components/schemas/CollectionPredicate"}, {"type": "null"}]}, "artist_role": {"type": "string", "enum": ["performer", "album_artist", "composer", "lyricist"]}, "order": {"enum": ["album", "name", "random"]}}, "required": ["artist_role", "order"]}}, "required": ["name", "description", "entity_type", "included", "excluded", "sort", "refresh", "playback"]}
    CollectionWrite:
      {"type": "object", "additionalProperties": false, "properties": {"expected_revision": {"anyOf": [{"type": "integer", "minimum": 1}, {"type": "null"}]}, "definition": {"$ref": "#/components/schemas/CollectionDefinition"}}, "required": ["definition"]}
    CollectionRevision:
      {"type": "object", "additionalProperties": false, "properties": {"expected_revision": {"type": "integer", "minimum": 1}}, "required": ["expected_revision"]}
    CollectionRefreshRequest:
      {"type": "object", "additionalProperties": false, "properties": {"expected_result_version": {"anyOf": [{"type": "string"}, {"type": "null"}]}, "request_id": {"type": "string", "minLength": 1, "maxLength": 200}}, "required": ["request_id"]}
    CollectionPlayRequest:
      {"type": "object", "additionalProperties": false, "properties": {"result_version": {"type": "string"}, "entity_ids": {"anyOf": [{"type": "array", "items": {"type": "integer", "minimum": 1}, "uniqueItems": true, "maxItems": 10000}, {"type": "null"}]}}, "required": ["result_version"]}
    CollectionSettingsUpdate:
      {"type": "object", "additionalProperties": false, "properties": {"expected_revision": {"type": "integer", "minimum": 1}, "management_enabled": {"type": "boolean"}}, "required": ["expected_revision", "management_enabled"]}
    HomeSection:
      {"type": "object", "additionalProperties": false, "properties": {"id": {"type": "string", "minLength": 1, "maxLength": 100}, "collection_id": {"anyOf": [{"type": "integer", "minimum": 1}, {"type": "null"}]}, "builtin": {"anyOf": [{"enum": ["now_playing", "library", "history", "devices", "stats", "core"]}, {"type": "null"}]}, "title": {"anyOf": [{"type": "string", "maxLength": 300}, {"type": "null"}]}, "layout": {"enum": ["card", "list", "grid", "carousel", "chips"]}, "preview_count": {"type": "integer", "minimum": 1, "maximum": 100}, "width": {"enum": ["wide", "narrow"]}, "hidden": {"type": "boolean"}, "track_columns": {"type": "array", "items": {"enum": ["artist", "album", "year", "genres", "duration", "availability"]}}}, "required": ["id", "layout", "preview_count", "width", "hidden", "track_columns"]}
    HomeLayoutUpdate:
      {"type": "object", "additionalProperties": false, "properties": {"expected_revision": {"type": "integer", "minimum": 1}, "sections": {"type": "array", "maxItems": 40, "items": {"$ref": "#/components/schemas/HomeSection"}}}, "required": ["expected_revision", "sections"]}
