openapi: 3.1.0
info:
  title: IntMusic Local Music Core API
  version: 1.6.0
  description: >-
    Clients may fence API requests with both X-IntMusic-Server-Id and
    X-IntMusic-Catalog-Epoch headers. A mismatching identity returns 409 before
    the handler runs; partial or duplicate identity headers return 400.
    Collection and home-layout writes require both headers. Other API domains retain their own request requirements. This is a consistency
    guard, not authentication. GET /status advertises catalog_identity_guard.
servers:
  - url: http://127.0.0.1:49330/api/v1
paths:
  /collections:
    get:
      summary: List typed collection summaries including protected system collections
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
    post:
      summary: Create a collection and publish its first result atomically
      parameters:
        - {"in": "header", "name": "x-intmusic-server-id", "required": true, "schema": {"type": "string"}}
        - {"in": "header", "name": "x-intmusic-catalog-epoch", "required": true, "schema": {"type": "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionWrite"
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
        "409":
          description: Catalog, definition, result or layout changed; refresh before retrying
        "422":
          description: Invalid typed input or empty playback result
  /collections/rule-schema:
    get:
      summary: Return typed fields, operators, nesting limits and UTC refresh boundary
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
  /collections/preview:
    post:
      summary: Preview a definition without saving or changing playback
      parameters:
        - {"in": "header", "name": "x-intmusic-server-id", "required": true, "schema": {"type": "string"}}
        - {"in": "header", "name": "x-intmusic-catalog-epoch", "required": true, "schema": {"type": "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionDefinition"
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
        "409":
          description: Catalog, definition, result or layout changed; refresh before retrying
        "422":
          description: Invalid typed input or empty playback result
  /collections/entities/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: {"type": "string", "enum": ["track", "album", "artist", "genre"]}
    get:
      summary: Find selectable entities by text or explicit IDs
      parameters:
        - {"in": "query", "name": "q", "schema": {"type": "string"}}
        - {"in": "query", "name": "ids", "schema": {"type": "string", "description": "Comma-separated positive entity IDs; maximum 200"}}
        - {"in": "query", "name": "offset", "schema": {"type": "integer", "minimum": 0}}
        - {"in": "query", "name": "limit", "schema": {"type": "integer", "minimum": 1, "maximum": 200}}
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
  /collections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {"type": "integer", "minimum": 1}
    get:
      summary: Read a fixed result batch; subsequent pages require result_version
      parameters:
        - {"in": "query", "name": "result_version", "schema": {"type": "string"}}
        - {"in": "query", "name": "offset", "schema": {"type": "integer", "minimum": 0}}
        - {"in": "query", "name": "limit", "schema": {"type": "integer", "minimum": 1, "maximum": 200}}
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
    patch:
      summary: Save rules and publish results with revision conflict detection
      parameters:
        - {"in": "header", "name": "x-intmusic-server-id", "required": true, "schema": {"type": "string"}}
        - {"in": "header", "name": "x-intmusic-catalog-epoch", "required": true, "schema": {"type": "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionWrite"
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
        "409":
          description: Catalog, definition, result or layout changed; refresh before retrying
        "422":
          description: Invalid typed input or empty playback result
    delete:
      summary: Delete a user collection and remove its home references
      parameters:
        - {"in": "header", "name": "x-intmusic-server-id", "required": true, "schema": {"type": "string"}}
        - {"in": "header", "name": "x-intmusic-catalog-epoch", "required": true, "schema": {"type": "string"}}
        - {"in": "query", "name": "expected_revision", "required": true, "schema": {"type": "integer", "minimum": 1}}
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
        "409":
          description: Catalog, definition, result or layout changed; refresh before retrying
        "422":
          description: Invalid typed input or empty playback result
  /collections/{id}/refresh:
    parameters:
      - name: id
        in: path
        required: true
        schema: {"type": "integer", "minimum": 1}
    post:
      summary: Generate a new batch with an idempotency key
      parameters:
        - {"in": "header", "name": "x-intmusic-server-id", "required": true, "schema": {"type": "string"}}
        - {"in": "header", "name": "x-intmusic-catalog-epoch", "required": true, "schema": {"type": "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionRefreshRequest"
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
        "409":
          description: Catalog, definition, result or layout changed; refresh before retrying
        "422":
          description: Invalid typed input or empty playback result
  /collections/{id}/reset:
    parameters:
      - name: id
        in: path
        required: true
        schema: {"type": "integer", "minimum": 1}
    post:
      summary: Restore protected system defaults while management is enabled
      parameters:
        - {"in": "header", "name": "x-intmusic-server-id", "required": true, "schema": {"type": "string"}}
        - {"in": "header", "name": "x-intmusic-catalog-epoch", "required": true, "schema": {"type": "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionRevision"
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
        "409":
          description: Catalog, definition, result or layout changed; refresh before retrying
        "422":
          description: Invalid typed input or empty playback result
  /collections/{id}/play:
    parameters:
      - name: id
        in: path
        required: true
        schema: {"type": "integer", "minimum": 1}
    post:
      summary: Resolve a complete frozen result batch into a validated playback plan
      parameters:
        - {"in": "header", "name": "x-intmusic-server-id", "required": true, "schema": {"type": "string"}}
        - {"in": "header", "name": "x-intmusic-catalog-epoch", "required": true, "schema": {"type": "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionPlayRequest"
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
        "409":
          description: Catalog, definition, result or layout changed; refresh before retrying
        "422":
          description: Invalid typed input or empty playback result
  /settings/collections:
    get:
      summary: Read the shared system collection management switch
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
    patch:
      summary: Change management with revision conflict detection
      parameters:
        - {"in": "header", "name": "x-intmusic-server-id", "required": true, "schema": {"type": "string"}}
        - {"in": "header", "name": "x-intmusic-catalog-epoch", "required": true, "schema": {"type": "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionSettingsUpdate"
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
        "409":
          description: Catalog, definition, result or layout changed; refresh before retrying
        "422":
          description: Invalid typed input or empty playback result
  /home-layout:
    get:
      summary: Read ordered home sections
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
    patch:
      summary: Replace home sections with revision conflict detection
      parameters:
        - {"in": "header", "name": "x-intmusic-server-id", "required": true, "schema": {"type": "string"}}
        - {"in": "header", "name": "x-intmusic-catalog-epoch", "required": true, "schema": {"type": "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeLayoutUpdate"
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
        "409":
          description: Catalog, definition, result or layout changed; refresh before retrying
        "422":
          description: Invalid typed input or empty playback result
  /genres/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {"type": "integer", "minimum": 1}
    get:
      summary: Read a genre and its current logical songs
      responses:
        "200":
          description: Catalog-fenced response; typed payloads and examples are documented in docs/collections.md and crates/protocol/src/collections.rs
  /status:
    get:
      summary: Return Core identity, catalog epoch, and library counts.
      responses:
        "200":
          description: Core status.
  /library/roots:
    get:
      summary: List library roots.
      responses:
        "200":
          description: Library roots.
    post:
      summary: Add a library root.
      responses:
        "200":
          description: Added root.
  /library-management/summary:
    get:
      summary: Return whole-library file, availability, issue, device, source, and storage totals.
      responses:
        "200":
          description: Library inventory summary.
  /library-management/files:
    get:
      summary: List every physical library file across Core and Client sources with catalog, metadata, issue, and availability state.
      responses:
        "200":
          description: Filtered and paged physical-file inventory.
  /library-management/files/{file_id}:
    get:
      summary: Return one physical file with embedded metadata evidence and its complete issue history.
      responses:
        "200":
          description: Physical file detail.
  /library-management/files/{file_id}/action:
    post:
      summary: Request a metadata rescan, ignore, reset, restore, or remove one physical file from the catalog inventory.
      responses:
        "200":
          description: Updated file lifecycle state.
  /library-management/files/actions:
    post:
      summary: Apply one inventory action to as many as 500 explicitly selected physical files.
      responses:
        "200":
          description: Batch file action counts.
  /library-management/tracks/merge/preview:
    post:
      summary: Compare selected physical files, choose a canonical track, and report identity conflicts before consolidation.
      responses:
        "200":
          description: Non-mutating merge preview.
  /library-management/tracks/merge:
    post:
      summary: Reversibly consolidate confirmed encodings and device copies into one release-track identity.
      responses:
        "200":
          description: Merge audit ID and consolidation counts.
  /library-management/tracks/auto-merge/preview:
    post:
      summary: Find conservatively matched duplicate release tracks using authoritative title, artist, album, position, version, year, kind, and duration metadata.
      responses:
        "200":
          description: Non-mutating exact-duplicate groups and aggregate counts.
  /library-management/tracks/auto-merge:
    post:
      summary: Revalidate and reversibly consolidate explicitly selected exact-duplicate groups.
      responses:
        "200":
          description: Batch merge counts, audit IDs, and any groups skipped after revalidation.
  /library-management/track-merges/{merge_id}/undo:
    post:
      summary: Restore the catalog links and media relationships recorded before a track merge.
      responses:
        "200":
          description: Reverted merge result.
  /library-management/devices:
    get:
      summary: List Core and every known Client, including offline or retired devices and all of their library sources.
      responses:
        "200":
          description: Global device and source inventory.
  /library-management/devices/{device_id}/action:
    post:
      summary: Retire, restore, or remove a logical Client device and its related inventory records without deleting physical music.
      responses:
        "200":
          description: Updated device lifecycle state.
  /library-management/sources/{root_id}/action:
    post:
      summary: Retire or restore a library source, or remove a Client source and its copy inventory without deleting physical files.
      responses:
        "200":
          description: Updated source lifecycle state.
  /client-library/manifests:
    get:
      summary: List device-owned library roots and their latest reconciliation state.
      responses:
        "200":
          description: Client library root statuses.
    post:
      summary: Upload one batch of a device-owned folder manifest. A complete batch reconciles files not seen in the current scan as missing.
      responses:
        "200":
          description: Accepted and missing file counts.
  /client-library/pending:
    get:
      summary: List local audio files whose embedded tags still require attention.
      responses:
        "200":
          description: Persistent pending-file inventory across all Clients.
  /client-library/files/{file_id}/resolve:
    post:
      summary: Match, manually describe, ignore, or reset a pending local audio file.
      responses:
        "200":
          description: Updated file resolution and optional track/media binding.
  /client-library/devices/{device_id}/roots/{root_external_id}:
    delete:
      summary: Disable a device-owned root and mark all of its media replicas missing.
      responses:
        "200":
          description: Root removed.
  /client-sync/mutations:
    post:
      summary: Idempotently apply favorite changes and playback sessions captured by a Client while Core was unavailable.
      responses:
        "200":
          description: Applied and previously acknowledged mutation IDs.
  /distributions:
    get:
      summary: List durable music distribution jobs and their progress.
      responses:
        "200":
          description: Distribution jobs.
    post:
      summary: Create a job that prepares and delivers selected tracks to a Client-owned library folder.
      responses:
        "200":
          description: Created distribution job.
  /distributions/{job_id}/cancel:
    post:
      summary: Cancel pending transcoding and delivery work for a distribution job.
      responses:
        "200":
          description: Cancelled or already-terminal distribution job.
  /distributions/tasks/next:
    get:
      summary: Lease the next prepared delivery task for a Client device.
      responses:
        "200":
          description: A task assignment or null when no work is ready.
  /distributions/tasks/{task_id}/progress:
    post:
      summary: Renew a delivery lease or report completion/failure.
      responses:
        "200":
          description: Updated parent distribution job.
  /distributions/tasks/{task_id}/content:
    get:
      summary: Stream the verified original or transcoded file assigned to a Client.
      responses:
        "200":
          description: Full media content.
        "206":
          description: Partial media content for a resumable download.
  /distributions/source-tasks/next:
    get:
      summary: Lease a source-upload task when selected media exists only on a Client.
      responses:
        "200":
          description: A source assignment or null when this Client has nothing to relay.
  /distributions/source-tasks/{task_id}/content:
    put:
      summary: Stream a Client-owned source replica into Core's verified relay cache.
      responses:
        "200":
          description: Source accepted and queued for transcoding or destination delivery.
  /distributions/source-tasks/{task_id}/progress:
    post:
      summary: Report a source-side failure so the upload can retry or terminate immediately.
      responses:
        "200":
          description: Updated parent distribution job.
  /transcoding/status:
    get:
      summary: Return bundled FFmpeg discovery, encoder capabilities, profiles, and cache status.
      responses:
        "200":
          description: Current transcoding capabilities.
  /scan/start:
    post:
      summary: Start a full library scan.
      responses:
        "202":
          description: Scan accepted.
  /albums:
    get:
      summary: List albums.
      responses:
        "200":
          description: Paged albums.
  /artists:
    get:
      summary: List artists.
      responses:
        "200":
          description: Paged artists.
  /tracks:
    get:
      summary: List tracks.
      responses:
        "200":
          description: Paged tracks.
  /tracks/{track_id}:
    get:
      summary: Return effective track metadata, file information, and lyrics.
      responses:
        "200":
          description: Track detail.
  /tracks/{track_id}/edit:
    get:
      summary: Return editable fields with file values, manual overrides, and revision.
      responses:
        "200":
          description: Track edit snapshot.
    post:
      summary: Apply revision-checked, non-destructive metadata and lyric edits.
      responses:
        "200":
          description: Updated track edit snapshot.
  /tracks/{track_id}/lyrics:
    get:
      summary: Return lyrics, translation, pronunciation, timing offset, and parsed cues.
      responses:
        "200":
          description: Structured lyric payload.
  /tracks/{track_id}/waveform:
    get:
      summary: Decode a track into normalized waveform peak bins for editing.
      responses:
        "200":
          description: Waveform peaks and track duration.
  /tracks/{track_id}/media:
    get:
      summary: Return the release-track identity, recording relationship, masters, encodings, and device replicas.
      responses:
        "200":
          description: Normalized media profile. Different releases remain independent release tracks.
  /tracks/{track_id}/recording/candidates:
    get:
      summary: Return metadata-based candidates that may use the same recording. This never links automatically.
      responses:
        "200":
          description: Ranked recording-link candidates with confidence reasons.
  /tracks/{track_id}/recording/link:
    post:
      summary: Confirm that this release track uses the same recording as another release track.
      responses:
        "200":
          description: Updated media profile. Both release-track and album entries remain intact.
  /tracks/{track_id}/recording/detach:
    post:
      summary: Give this release track a new independent recording identity.
      responses:
        "200":
          description: Updated independent media profile.
  /search:
    get:
      summary: Search tracks, albums, and artists.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search response.
  /outputs:
    get:
      summary: List core-local and registered remote audio outputs.
      responses:
        "200":
          description: Output devices.
  /renderers:
    get:
      summary: List registered playback renderers.
      responses:
        "200":
          description: Registered renderers.
  /renderers/register:
    post:
      summary: Register or refresh a client playback renderer.
      responses:
        "200":
          description: Registered renderer.
  /renderers/{client_id}/state:
    post:
      summary: Report renderer playback state.
      responses:
        "200":
          description: Playback state.
  /renderers/{client_id}/volume-state:
    post:
      summary: Report the actual system endpoint volume and its capabilities.
      responses:
        "200":
          description: Updated dual-layer zone volume state.
  /tracks/{track_id}/stream:
    get:
      summary: Stream an audio file to a renderer.
      responses:
        "200":
          description: Full audio stream.
        "206":
          description: Partial audio stream.
  /zones:
    get:
      summary: List playback zones.
      responses:
        "200":
          description: Playback zones.
  /zones/play-many:
    post:
      summary: Start the same track on multiple zones.
      responses:
        "200":
          description: Playback state for each target zone.
  /zones/{zone_id}/play:
    post:
      summary: Start playback in a zone.
      responses:
        "200":
          description: Playback state.
  /zones/{zone_id}/transfer:
    post:
      summary: Move current playback from one zone to another.
      responses:
        "200":
          description: Target and source playback states.
  /zones/{zone_id}/pause:
    post:
      summary: Pause playback in a zone.
      responses:
        "200":
          description: Playback state.
  /diagnostics/clients:
    get:
      summary: List client installation IDs with retained diagnostic logs
      responses:
        "200":
          description: Sorted client IDs; empty when no logs have been uploaded.
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients:
                    type: array
                    items: {type: string}
        "500":
          description: Diagnostic storage is unavailable.
  /diagnostics/clients/{id}/logs:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[A-Za-z0-9_-]+$'
    get:
      summary: Read recent retained diagnostic events for one client
      description: >-
        Events are returned in receipt order from the current and previous log
        files. An unknown client returns an empty events array. Retries may
        produce duplicates. Storage retains at most two 2 MiB files per client.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
          description: Maximum matching events returned; the server clamps to 1 through 500.
        - in: query
          name: level
          schema: {type: string}
          description: Exact match on the event level, for example error.
        - in: query
          name: after
          schema: {type: string}
          description: Exclusive lexical lower bound on the client UTC ISO timestamp string.
      responses:
        "200":
          description: Most recent matching events for the requested client.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, events]
                properties:
                  client_id: {type: string}
                  events:
                    type: array
                    maxItems: 500
                    items: {$ref: '#/components/schemas/ClientDiagnosticEvent'}
        "400":
          description: Invalid client ID or query parameter.
        "500":
          description: Diagnostic storage is unavailable.
    post:
      summary: Append a bounded batch of client diagnostic events
      description: >-
        Client-controlled opt-in upload. The entire JSON request must fit in
        128 KiB. Each serialized event must fit in 16 KiB, and serialized event
        lines together must fit in 128 KiB. At most 128 clients are retained.
        This stores diagnostic records only and does not update device presence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items: {$ref: '#/components/schemas/ClientDiagnosticEvent'}
      responses:
        "200":
          description: Batch appended to this client's log.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: {type: integer, minimum: 1, maximum: 32}
        "400":
          description: Invalid client ID, malformed JSON, event fields, or batch size.
        "413":
          description: Request body exceeds 128 KiB.
        "422":
          description: JSON does not match the batch request structure.
        "500":
          description: Diagnostic storage is unavailable.
        "507":
          description: Capacity for new client log files has been reached.
  /diagnostics:
    get:
      summary: Return diagnostic data.
      responses:
        "200":
          description: Diagnostic data.
  /library/roots/{id}:
    delete:
      summary: Remove a library root.
      responses:
        "200":
          description: Root removed.
  /client-sync/snapshot:
    get:
      summary: Return the normalized offline-first Client snapshot and authoritative physical-file bindings.
      responses:
        "200":
          description: Client synchronization snapshot.
  /client-sync/changes:
    get:
      summary: Return invalidated cache scopes after a synchronization cursor.
      responses:
        "200":
          description: Ordered synchronization changes.
  /client-sync/details:
    get:
      summary: Return a page of entity details for background cache warming.
      responses:
        "200":
          description: Entity details and continuation cursor.
  /scan/problems:
    get:
      summary: List problems recorded by library scans.
      responses:
        "200":
          description: Scan problems.
  /albums/{album_id}:
    get:
      summary: Return an album and its release-track ordering.
      responses:
        "200":
          description: Album detail.
  /albums/{album_id}/edit:
    get:
      summary: Return editable album metadata, credits, tracks, and artist references.
      responses:
        "200":
          description: Album editor snapshot.
    post:
      summary: Update album metadata and optionally propagate selected fields to selected tracks.
      responses:
        "200":
          description: Updated album editor snapshot.
  /albums/{album_id}/migrate:
    post:
      summary: Move a duplicate album identity and all of its tracks into another album.
      responses:
        "200":
          description: Canonical target album and migration result.
  /artists/{artist_id}:
    get:
      summary: Return artist metadata, releases, tracks, assets, and visuals.
      responses:
        "200":
          description: Artist detail.
    post:
      summary: Update user-managed artist profile fields.
      responses:
        "200":
          description: Updated artist detail.
  /artists/{artist_id}/musicbrainz/preview:
    post:
      summary: Preview MusicBrainz profile metadata without changing local data.
      responses:
        "200":
          description: Metadata preview.
  /artists/{artist_id}/assets:
    get:
      summary: List artist image assets.
      responses:
        "200":
          description: Artist assets.
    post:
      summary: Upload one or more artist image assets.
      responses:
        "200":
          description: Updated artist detail.
  /artists/{artist_id}/assets/{asset_id}:
    post:
      summary: Update an artist asset classification.
      responses:
        "200":
          description: Updated asset.
    delete:
      summary: Soft-delete an artist asset.
      responses:
        "200":
          description: Updated artist detail.
  /artists/{artist_id}/visuals/{slot}:
    post:
      summary: Update one artist visual slot and up to five crop regions.
      responses:
        "200":
          description: Updated visual.
  /artwork/albums/{album_id}:
    get:
      summary: Return album artwork.
      responses:
        "200":
          description: Encoded artwork.
  /artwork/tracks/{track_id}:
    get:
      summary: Return track artwork.
      responses:
        "200":
          description: Encoded artwork.
  /artwork/artists/{artist_id}/{slot}:
    get:
      summary: Render an artist visual slot at the requested size.
      responses:
        "200":
          description: Encoded artist artwork.
  /tracks/{track_id}/favorite:
    post:
      summary: Update favorite and user-rating state.
      responses:
        "200":
          description: Updated track summary.
  /zones/{zone_id}/play-collection:
    post:
      summary: Atomically replace a queue and start one selected collection item.
      responses:
        "200":
          description: Playback state and queue.
  /zones/{zone_id}/stop:
    post:
      summary: Stop playback in a zone.
      responses:
        "200":
          description: Playback state.
  /zones/{zone_id}/seek:
    post:
      summary: Seek the active zone.
      responses:
        "200":
          description: Playback state.
  /zones/{zone_id}/queue:
    get:
      summary: Return the durable queue snapshot.
      responses:
        "200":
          description: Playback queue.
    post:
      summary: Replace the durable queue and current index.
      responses:
        "200":
          description: Playback queue.
  /zones/{zone_id}/queue/items:
    post:
      summary: Add one or more items to a durable queue.
      responses:
        "200":
          description: Playback queue.
  /zones/{zone_id}/queue/items/{item_id}:
    delete:
      summary: Remove one durable queue item.
      responses:
        "200":
          description: Playback queue.
  /zones/{zone_id}/queue/move:
    post:
      summary: Move an item within a durable queue.
      responses:
        "200":
          description: Playback queue.
  /zones/{zone_id}/queue/mode:
    post:
      summary: Change sequential, repeat, or shuffle behavior.
      responses:
        "200":
          description: Playback queue.
  /zones/{zone_id}/next:
    post:
      summary: Advance according to the persisted queue mode.
      responses:
        "200":
          description: Playback state.
  /zones/{zone_id}/previous:
    post:
      summary: Move backward according to the persisted queue mode.
      responses:
        "200":
          description: Playback state.
  /zones/{zone_id}/volume:
    get:
      summary: Return player and system-endpoint volume layers.
      responses:
        "200":
          description: Dual-layer zone volume.
    post:
      summary: Update the selected player or system-endpoint volume layer.
      responses:
        "200":
          description: Dual-layer zone volume.
  /zones/{zone_id}/alias:
    post:
      summary: Set or clear the user-facing zone alias.
      responses:
        "200":
          description: Updated zone.
  /playback/history:
    get:
      summary: List playback transport events.
      responses:
        "200":
          description: Playback events.
  /playback-v3/zones/{zone_id}/session:
    get:
      summary: Return the durable v3 playback session snapshot for one output.
      responses:
        "200":
          description: Playback session snapshot with epoch, revision and optional queue_source (system_key, result_version, name).
  /playback-v3/zones/{zone_id}/commands:
    post:
      summary: Apply one idempotent revision-checked playback command. replace_queue_and_play may carry source (system_key, result_version, name); referenced batch membership and availability are checked before replacing the queue.
      responses:
        "200":
          description: Applied, duplicate, rejected, or conflict ACK.
  /playback-v3/zones/{zone_id}/resume:
    post:
      summary: Resume a playback session from an event cursor and known revision.
      responses:
        "200":
          description: Authoritative snapshot and any retained session events.
  /playback/sessions:
    get:
      summary: List completed and active listening sessions.
      responses:
        "200":
          description: Playback sessions.
  /playback/stats:
    get:
      summary: Return aggregate listening statistics.
      responses:
        "200":
          description: Playback statistics.
  /tracks/{track_id}/display:
    post:
      summary: Set the album edition's display attribute (inherit, merged, independent). Copies share the choice; album identity and files are unchanged.
      responses:
        "200":
          description: cursor identifying the saved change. Snapshots at or beyond this cursor replace optimistic client state.
  /settings/song-display:
    post:
      summary: "Set global song list presentation: merge_same_name, attribute_filter (all, inherit, merged, independent), and sort_by_mode. Per-edition choices override grouping. Playback queues retain every item and actual order."
      responses:
        "200":
          description: Saved song display settings, also returned by GET /settings and sync snapshots.
  /library/tag-mappings/apply:
    post:
      summary: Recompute multi-value catalog tags from original metadata and manual overrides using saved delimiters and user-defined tag_mappings. Each rule defines source, 1-5 literal targets and selected fields (genres, track_artists, album_artists, composers, lyricists). Music files remain unchanged.
      responses:
        "200":
          description: Number of updated_tracks. Repeating the operation is idempotent.
  /settings:
    get:
      summary: Return the complete server settings projection.
      responses:
        "200":
          description: Settings.
  /settings/server:
    get:
      summary: Return server identity settings.
      responses:
        "200":
          description: Server settings.
    post:
      summary: Update server identity settings.
      responses:
        "200":
          description: Server settings.
  /settings/favorites:
    get:
      summary: Return favorite and rating interoperability settings.
      responses:
        "200":
          description: Favorite settings.
    post:
      summary: Update favorite and rating interoperability settings.
      responses:
        "200":
          description: Favorite settings.
  /settings/metadata:
    get:
      summary: Return metadata parsing settings.
      responses:
        "200":
          description: Metadata settings.
    post:
      summary: Update metadata parsing settings.
      responses:
        "200":
          description: Metadata settings.

components:
  schemas:
    ClientDiagnosticEvent:
      type: object
      required: [timestamp, event]
