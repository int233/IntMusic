name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android artifacts
        run: |
          ./scripts/build-release-artifacts.sh \
            --skip-core \
            --skip-linux \
            --skip-android-aab \
            --release-id actions-android \
            --output packaging/dist/actions/android

      - uses: actions/upload-artifact@v4
        with:
          name: intmusic-android
          path: packaging/dist/actions/android/**

  ubuntu:
    name: Ubuntu release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            liblzma-dev \
            nasm \
            ninja-build \
            pkg-config

      - uses: actions/cache@v4
        with:
          path: |
            .cache/ffmpeg
            packaging/ffmpeg/linux-x86_64
          key: ffmpeg-8.1.2-linux-x86_64-${{ hashFiles('scripts/build-bundled-ffmpeg.sh') }}

      - name: Build bundled LGPL FFmpeg
        run: |
          if [ ! -x packaging/ffmpeg/linux-x86_64/bin/ffmpeg ]; then
            ./scripts/build-bundled-ffmpeg.sh \
              --output packaging/ffmpeg/linux-x86_64
          fi

      - name: Build Ubuntu artifacts
        run: |
          ./scripts/build-release-artifacts.sh \
            --skip-android \
            --release-id actions-ubuntu \
            --output packaging/dist/actions/ubuntu

      - uses: actions/upload-artifact@v4
        with:
          name: intmusic-ubuntu
          path: packaging/dist/actions/ubuntu/**

  windows:
    name: Windows release build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            .cache/ffmpeg
            packaging/ffmpeg/windows-x64
          key: ffmpeg-8.1.2-windows-x64-${{ hashFiles('scripts/build-bundled-ffmpeg.sh') }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            curl
            diffutils
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            nasm
            pkgconf
            tar
            xz

      - name: Build bundled LGPL FFmpeg
        shell: msys2 {0}
        run: |
          if [ ! -x packaging/ffmpeg/windows-x64/bin/ffmpeg.exe ]; then
            ./scripts/build-bundled-ffmpeg.sh \
              --output packaging/ffmpeg/windows-x64
          fi

      - name: Verify bundled FFmpeg outside MSYS2
        shell: pwsh
        run: |
          .\scripts\test-windows-ffmpeg-bundle.ps1 `
            -Bundle packaging\ffmpeg\windows-x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          .\scripts\build-release-artifacts.ps1 `
            -SkipAndroid `
            -ReleaseId actions-windows `
            -Output packaging\dist\actions\windows

      - name: Smoke test Windows installer and upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem `
            -Path "packaging\dist\actions\windows\windows" `
            -Filter "IntMusic-Windows-Setup-*.exe" |
            Select-Object -First 1
          if ($null -eq $setup) {
            throw "Windows installer artifact was not found."
          }

          try {
            foreach ($pass in 1..2) {
              $installer = Start-Process `
                -FilePath $setup.FullName `
                -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TYPE=coreonly" `
                -Wait `
                -PassThru
              if ($installer.ExitCode -ne 0) {
                throw "Windows installer pass $pass failed with exit code $($installer.ExitCode)."
              }
            }

            $service = Get-Service -Name "IntMusicCore" -ErrorAction Stop
            if ($service.Status -ne "Running") {
              throw "IntMusicCore is $($service.Status) after installer upgrade."
            }

            $endpointFile = Join-Path `
              $env:ProgramData `
              "IntMusic\Core\data\core-endpoint.json"
            $endpoint = Get-Content -LiteralPath $endpointFile -Raw |
              ConvertFrom-Json
            $status = Invoke-RestMethod `
              -Uri "$($endpoint.base_url)/api/v1/status" `
              -Method Get `
              -TimeoutSec 5
            if ($status.name -ne "IntMusic Local Music Core" -or
                $status.api_version -ne "v1") {
              throw "Installed Core returned an unexpected health response."
            }
            $transcoding = Invoke-RestMethod `
              -Uri "$($endpoint.base_url)/api/v1/transcoding/status" `
              -Method Get `
              -TimeoutSec 10
            if (-not $transcoding.available) {
              throw "Installed Core did not discover bundled FFmpeg: $($transcoding.error)"
            }
          }
          finally {
            $uninstaller = Join-Path `
              $env:ProgramFiles `
              "IntMusic\unins000.exe"
            if (Test-Path -LiteralPath $uninstaller) {
              Start-Process `
                -FilePath $uninstaller `
                -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
                -Wait
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: intmusic-windows
          path: packaging/dist/actions/windows/**

  macos:
    name: macOS release build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            .cache/ffmpeg
            packaging/ffmpeg/macos-arm64
            packaging/ffmpeg/macos-x86_64
          key: ffmpeg-8.1.2-macos-${{ runner.arch }}-${{ hashFiles('scripts/build-bundled-ffmpeg.sh') }}

      - name: Build bundled LGPL FFmpeg
        run: |
          target="macos-$(uname -m)"
          if [ ! -x "packaging/ffmpeg/$target/bin/ffmpeg" ]; then
            ./scripts/build-bundled-ffmpeg.sh \
              --output "packaging/ffmpeg/$target"
          fi

      - name: Build macOS artifacts
        run: |
          ./scripts/build-release-artifacts.sh \
            --skip-android \
            --release-id actions-macos \
            --output packaging/dist/actions/macos

      - uses: actions/upload-artifact@v4
        with:
          name: intmusic-macos
          path: packaging/dist/actions/macos/**
