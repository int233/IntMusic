name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config

      - name: Build Ubuntu artifacts
        run: |
          ./scripts/build-release-artifacts.sh \
            --skip-android \
            --release-id actions-ubuntu \
            --output packaging/dist/actions/ubuntu

      - uses: actions/upload-artifact@v4
        with:
          name: intmusic-ubuntu
          path: packaging/dist/actions/ubuntu/**

  windows:
    name: Windows release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          .\scripts\build-release-artifacts.ps1 `
            -SkipAndroid `
            -ReleaseId actions-windows `
            -Output packaging\dist\actions\windows

      - uses: actions/upload-artifact@v4
        with:
          name: intmusic-windows
          path: packaging/dist/actions/windows/**

  macos:
    name: macOS release build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build macOS artifacts
        run: |
          ./scripts/build-release-artifacts.sh \
            --skip-android \
            --release-id actions-macos \
            --output packaging/dist/actions/macos

      - uses: actions/upload-artifact@v4
        with:
          name: intmusic-macos
          path: packaging/dist/actions/macos/**
